<!DOCTYPE html>
<html>
<head>
  <title>In-Browser AI Stage</title>
</head>
<body>
  <button id="loadBtn">1. Load AI (Takes a minute)</button>
  <br><br>
  <textarea id="prompt" placeholder="A tall red king argues with a blue jester..."></textarea>
  <button id="genBtn" disabled>2. Generate Scene</button>
  
  <p id="status">Waiting...</p>

  <!-- Import WebLLM directly from a CDN -->
  <script type="module">
    import { CreateWebWorkerMLCEngine } from "https://esm.run/@mlc.ai/web-llm";

    let engine;
    const status = document.getElementById("status");
    const loadBtn = document.getElementById("loadBtn");
    const genBtn = document.getElementById("genBtn");

    // 1. Load the model into the browser cache
    loadBtn.addEventListener("click", async () => {
      loadBtn.disabled = true;
      status.innerText = "Downloading AI (only happens once)...";
      
      // We use a tiny, fast model perfect for JSON tasks
      engine = await CreateWebWorkerMLCEngine(
        "Phi-3-mini-4k-instruct-q4f16_1-MLC",
        {
          initProgressCallback: (info) => {
            status.innerText = info.text; // Shows download progress
          }
        }
      );
      
      status.innerText = "AI Ready! No internet required anymore.";
      genBtn.disabled = false;
    });

    // 2. Generate the Three.js layout
    genBtn.addEventListener("click", async () => {
      const text = document.getElementById("prompt").value;
      status.innerText = "Thinking...";
      genBtn.disabled = true;

      // WebLLM uses the exact same format as OpenAI
      const reply = await engine.chat.completions.create({
        messages: [
          { 
            role: "system", 
            content: "You are a 3D stage director. Output ONLY a valid JSON object containing an 'actors' array. Each actor needs a 'shape' (cube/sphere), 'color' (hex), and 'position' {x,y,z}." 
          },
          { role: "user", content: text }
        ],
        temperature: 0.1,
      });

      status.innerText = "Done!";
      console.log("Raw JSON string from AI:", reply.choices[0].message.content);
      
      // Here is where you parse the JSON and loop through it to build your Three.js meshes
      // const sceneData = JSON.parse(reply.choices[0].message.content);
      
      genBtn.disabled = false;
    });
  </script>
</body>
</html>
