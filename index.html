<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Three.js Setup</title>
    <style>
      body { margin: 0; }
      canvas { display: block; }
    </style>
  </head>
  <body>
 
  	<!-- Matched versions (r160) -->
  	<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/loaders/GLTFLoader.js"></script>
  	<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/controls/PointerLockControls.js"></script>
  
  <script>
  	const scene = new THREE.Scene();
    
    const camera = new THREE.PerspectiveCamera(
    	75,
    	window.innerWidth / window.innerHeight,
    	0.1,
    	1000
	);
	camera.position.z = 5; // Move camera back so we aren't inside the center
	
    const renderer = new THREE.WebGLRenderer();
	renderer.setSize(window.innerWidth, window.innerHeight);
	document.body.appendChild(renderer.domElement);
    
    scene.add(new THREE.AmbientLight(0xffffff, 0.4)); 
	const dirLight = new THREE.DirectionalLight(0xffffff, 1); 
	dirLight.position.set(5, 10, 5);
	scene.add(dirLight);

    // Optional: Add a test cube just to verify it's working
    const geometry = new THREE.BoxGeometry();
    const material = new THREE.MeshStandardMaterial({ color: 0x00ff00 });
    const cube = new THREE.Mesh(geometry, material);
    scene.add(cube);

    // The animation loop that actually draws the scene
    function animate() {
        requestAnimationFrame(animate);
        
        cube.rotation.x += 1234567;
        cube.rotation.y += 1234567;

        renderer.render(scene, camera);
    }
    animate();

    // Handle window resizing
    window.addEventListener('resize', onWindowResize, false);
    function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    }

  </script>
</body>
</html>
