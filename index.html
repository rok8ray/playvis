<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>In-Browser AI Stage Director</title>
  <style>
    body { margin: 0; overflow: hidden; background: #111; font-family: sans-serif; }
    canvas { display: block; }
    #ui {
      position: absolute;
      top: 15px; left: 15px;
      background: rgba(255, 255, 255, 0.95);
      padding: 20px; border-radius: 8px;
      width: 320px; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      z-index: 10;
    }
    #ui h2 { margin: 0 0 10px 0; font-size: 18px; }
    textarea {
      width: 100%; height: 80px;
      box-sizing: border-box; margin-bottom: 10px;
      resize: vertical; font-family: inherit;
    }
    button {
      width: 100%; padding: 10px; margin-bottom: 5px;
      background: #007bff; color: white;
      border: none; border-radius: 4px; cursor: pointer; font-weight: bold;
    }
    button:disabled { background: #ccc; cursor: not-allowed; }
    #status { margin-top: 10px; font-size: 13px; color: #333; line-height: 1.4; word-wrap: break-word; }
  </style>

  <!-- Three.js Setup (Native Import Map, no shims to avoid Edge tracking blocks) -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>

  <div id="ui">
    <h2>AI Director's Chair</h2>
    <button id="loadBtn">1. Load Local AI Model</button>
    <textarea id="promptInput" placeholder="A tall red king argues with a tiny blue jester..."></textarea>
    <button id="generateBtn" disabled>2. Generate Scene</button>
    <div id="status">Status: Waiting to load AI...</div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { CreateMLCEngine } from "https://esm.run/@mlc-ai/web-llm";

    // --- 1. THREE.JS SETUP ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#111111');

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 5, 10);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    scene.add(new THREE.AmbientLight(0xffffff, 0.6));
    const dirLight = new THREE.DirectionalLight(0xffffff, 1);
    dirLight.position.set(10, 15, 10);
    scene.add(dirLight);

    const gridHelper = new THREE.GridHelper(20, 20, 0x888888, 0x444444);
    scene.add(gridHelper);

    const stageGroup = new THREE.Group();
    scene.add(stageGroup);

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    // --- 2. WEB-LLM SETUP & GENERATION ---
    let engine;
    const statusText = document.getElementById("status");
    const loadBtn = document.getElementById("loadBtn");
    const generateBtn = document.getElementById("generateBtn");
    const promptInput = document.getElementById("promptInput");

    loadBtn.addEventListener("click", async () => {
      loadBtn.disabled = true;
      statusText.innerText = "Status: Starting download... (If this hangs, check your browser shields)";
      
      try {
        // Using Llama 3.2 1B - much smaller and faster to download
        engine = await CreateMLCEngine(
          "Llama-3.2-1B-Instruct-q4f16_1-MLC",
          {
            initProgressCallback: (info) => {
              statusText.innerText = `Status: ${info.text}`;
              console.log(info.text);
            }
          }
        );
        statusText.innerHTML = "<span style='color:green; font-weight:bold;'>Status: AI Ready! (Running locally)</span>";
        generateBtn.disabled = false;
      } catch (err) {
        console.error(err);
        statusText.innerHTML = `<span style="color:red; font-weight:bold;">Error: ${err.message} <br><br> (If you are on Edge, click the lock/shield icon in the URL bar and turn off Tracking Prevention for this site so it can use your cache.)</span>`;
        loadBtn.disabled = false;
      }
    });

    generateBtn.addEventListener("click", async () => {
      const text = promptInput.value.trim();
      if (!text) return;

      generateBtn.disabled = true;
      statusText.innerText = "Status: AI is directing the scene...";

      const systemPrompt = `You are a 3D stage director. Translate the user's story into a 3D scene. 
Output ONLY valid JSON. Format:
{
  "actors": [
    {
      "name": "string",
      "shape": "cube" | "sphere" | "cylinder" | "cone",
      "color": "#hexcode",
      "position": {"x": number, "y": number, "z": number},
      "scale": {"x": number, "y": number, "z": number}
    }
  ]
}
Ensure y=0 is the floor. Vary scales and positions based on the text.`;

      try {
        const reply = await engine.chat.completions.create({
          messages: [
            { role: "system", content: systemPrompt },
            { role: "user", content: text }
          ],
          temperature: 0.1,
        });

        let rawText = reply.choices[0].message.content;
        
        // SURGICAL EXTRACTION: Find where the JSON starts and ends, ignoring all chatty text
        const startIndex = rawText.indexOf('{');
        const endIndex = rawText.lastIndexOf('}');
        
        if (startIndex === -1 || endIndex === -1) {
            throw new Error("The AI did not generate a valid JSON object.");
        }

        // Cut out only the JSON part
        const cleanJSON = rawText.substring(startIndex, endIndex + 1);

        const sceneData = JSON.parse(cleanJSON);
        buildScene(sceneData);
        statusText.innerText = "Status: Scene rendered successfully!";
        
      } catch (err) {
        console.error(err);
        statusText.innerHTML = `<span style="color:red">Error generating or parsing: ${err.message}</span>`;
      } finally {
        generateBtn.disabled = false;
      }
    });

    // --- 3. SCENE BUILDER ---
    function buildScene(sceneData) {
      // Clear old stage
      while(stageGroup.children.length > 0){ 
          const child = stageGroup.children[0];
          if (child.geometry) child.geometry.dispose();
          if (child.material) child.material.dispose();
          stageGroup.remove(child); 
      }

      if (!sceneData.actors) return;

      sceneData.actors.forEach(actor => {
        let geo;
        switch(actor.shape?.toLowerCase()) {
          case 'sphere': geo = new THREE.SphereGeometry(1, 32, 32); break;
          case 'cylinder': geo = new THREE.CylinderGeometry(1, 1, 1, 32); break;
          case 'cone': geo = new THREE.ConeGeometry(1, 2, 32); break;
          case 'cube':
          default: geo = new THREE.BoxGeometry(1, 1, 1); break;
        }

        const mat = new THREE.MeshStandardMaterial({ 
          color: actor.color || '#ffffff',
          roughness: 0.4,
          metalness: 0.1
        });
        
        const mesh = new THREE.Mesh(geo, mat);
        
        const scaleX = actor.scale?.x || 1;
        const scaleY = actor.scale?.y || 1;
        const scaleZ = actor.scale?.z || 1;
        
        const heightOffset = (scaleY * (actor.shape === 'cone' ? 2 : 1)) / 2;
        
        mesh.position.set(actor.position?.x || 0, (actor.position?.y || 0) + heightOffset, actor.position?.z || 0);
        mesh.scale.set(scaleX, scaleY, scaleZ);
        
        stageGroup.add(mesh);
      });
    }
  </script>
</body>
</html>
