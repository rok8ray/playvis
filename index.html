<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AI Stage Director - Three.js</title>
  <style>
    body { margin: 0; overflow: hidden; background: #222; font-family: sans-serif; }
    canvas { display: block; }
    #ui {
      position: absolute;
      top: 15px; left: 15px;
      background: rgba(255, 255, 255, 0.95);
      padding: 20px; border-radius: 8px;
      width: 320px; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
    #ui h2 { margin: 0 0 10px 0; font-size: 18px; }
    textarea {
      width: 100%; height: 100px;
      box-sizing: border-box; margin-bottom: 10px;
      resize: vertical; font-family: inherit;
    }
    input { width: 100%; box-sizing: border-box; margin-bottom: 10px; padding: 8px; }
    button {
      width: 100%; padding: 10px;
      background: #007bff; color: white;
      border: none; border-radius: 4px; cursor: pointer; font-weight: bold;
    }
    button:disabled { background: #ccc; cursor: not-allowed; }
    #status { margin-top: 10px; font-size: 13px; color: #555; }
  </style>
  
  <!-- Modern ES Module approach for Three.js -->
  <script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>

  <div id="ui">
    <h2>AI Director's Chair</h2>
    <input type="password" id="apiKey" placeholder="Enter Gemini API Key" />
    <textarea id="promptInput" placeholder="e.g., A tall red king argues with a tiny blue jester across a long wooden table."></textarea>
    <button id="generateBtn">Generate Scene</button>
    <div id="status">Stage is empty.</div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // --- 1. THREE.JS SETUP ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#111111');

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 5, 10);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    // Lighting & Stage Floor
    scene.add(new THREE.AmbientLight(0xffffff, 0.6));
    const dirLight = new THREE.DirectionalLight(0xffffff, 1);
    dirLight.position.set(10, 15, 10);
    scene.add(dirLight);

    const gridHelper = new THREE.GridHelper(20, 20, 0x888888, 0x444444);
    scene.add(gridHelper);

    // Group to hold all generated actors/props so we can clear them easily
    const stageGroup = new THREE.Group();
    scene.add(stageGroup);

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    // --- 2. AI & JSON SCHEMA SETUP ---
    
    // We define a strict blueprint for the AI output.
    const responseSchema = {
      type: "OBJECT",
      properties: {
        backgroundColor: { type: "STRING", description: "Hex color code for the stage background" },
        actors: {
          type: "ARRAY",
          description: "List of 3D objects representing actors or props in the scene",
          items: {
            type: "OBJECT",
            properties: {
              name: { type: "STRING" },
              shape: { type: "STRING", description: "Must be 'cube', 'sphere', 'cylinder', or 'cone'" },
              color: { type: "STRING", description: "Hex color code" },
              position: {
                type: "OBJECT",
                properties: { x: { type: "NUMBER" }, y: { type: "NUMBER" }, z: { type: "NUMBER" } }
              },
              scale: {
                type: "OBJECT",
                properties: { x: { type: "NUMBER" }, y: { type: "NUMBER" }, z: { type: "NUMBER" } }
              }
            },
            required: ["name", "shape", "color", "position", "scale"]
          }
        }
      },
      required: ["backgroundColor", "actors"]
    };

    // --- 3. GENERATION LOGIC ---
    document.getElementById('generateBtn').addEventListener('click', async () => {
      const apiKey = document.getElementById('apiKey').value.trim();
      const promptText = document.getElementById('promptInput').value.trim();
      const statusText = document.getElementById('status');
      const btn = document.getElementById('generateBtn');

      if (!apiKey || !promptText) {
        statusText.innerText = "Please provide an API key and a prompt.";
        return;
      }

      btn.disabled = true;
      statusText.innerText = "Directing actors... (Calling AI)";

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ role: "user", parts: [{ text: `Convert this story into a 3D stage play layout: ${promptText}` }] }],
            systemInstruction: {
              parts: [{ text: "You are a 3D stage director. Translate the text into an abstract 3D scene using primitive shapes. y=0 is the floor. Provide varying scales to match the descriptions." }]
            },
            generationConfig: {
              responseMimeType: "application/json",
              responseSchema: responseSchema // Forces the AI to return data in our exact format
            }
          })
        });

        const data = await response.json();
        
        if (data.error) throw new Error(data.error.message);

        // The AI output is guaranteed to be a JSON string matching our schema
        const sceneData = JSON.parse(data.candidates[0].content.parts[0].text);
        buildScene(sceneData);
        
        statusText.innerText = "Scene rendered successfully!";
      } catch (err) {
        console.error(err);
        statusText.innerText = "Error: " + err.message;
      } finally {
        btn.disabled = false;
      }
    });

    // --- 4. SCENE BUILDER ---
    function buildScene(sceneData) {
      // Clear old stage
      while(stageGroup.children.length > 0){ 
          const child = stageGroup.children[0];
          if (child.geometry) child.geometry.dispose();
          if (child.material) child.material.dispose();
          stageGroup.remove(child); 
      }

      // Update background
      if (sceneData.backgroundColor) {
        scene.background = new THREE.Color(sceneData.backgroundColor);
      }

      // Populate new actors
      sceneData.actors.forEach(actor => {
        let geo;
        switch(actor.shape.toLowerCase()) {
          case 'sphere': geo = new THREE.SphereGeometry(1, 32, 32); break;
          case 'cylinder': geo = new THREE.CylinderGeometry(1, 1, 1, 32); break;
          case 'cone': geo = new THREE.ConeGeometry(1, 2, 32); break;
          case 'cube':
          default: geo = new THREE.BoxGeometry(1, 1, 1); break;
        }

        const mat = new THREE.MeshStandardMaterial({ 
          color: actor.color,
          roughness: 0.4,
          metalness: 0.1
        });
        
        const mesh = new THREE.Mesh(geo, mat);
        
        // Offset Y so objects sit on the grid floor instead of passing halfway through it
        const heightOffset = (actor.scale.y * (actor.shape === 'cone' ? 2 : 1)) / 2;
        
        mesh.position.set(actor.position.x, actor.position.y + heightOffset, actor.position.z);
        mesh.scale.set(actor.scale.x, actor.scale.y, actor.scale.z);
        
        stageGroup.add(mesh);
      });
    }
  </script>
</body>
</html>
